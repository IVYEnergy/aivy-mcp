<!doctype html>
<html><head><meta charset="utf-8"><title>Aivy card host (test)</title>
<style>body{margin:0;padding:16px;background:#eef0f4;font-family:system-ui}body[data-theme=dark]{background:#0f1113}iframe{border:0;width:100%;max-width:600px;display:block;height:60px}</style></head>
<body>
<!-- A minimal MCP Apps host: answers ui/initialize, sends the sample tool
     result after ui/notifications/initialized, grows the iframe on
     size-changed, and records tools/call so the Apply button can be tested. -->
<iframe id="f" sandbox="allow-scripts"></iframe>
<script>
const q = new URLSearchParams(location.search);
const theme = q.get('theme') || 'light';
document.body.dataset.theme = theme;
window.calls = [];
const f = document.getElementById('f');
window.addEventListener('message', async (ev) => {
  const m = ev.data; if (!m || m.jsonrpc !== '2.0') return;
  const reply = (id, result) => f.contentWindow.postMessage({ jsonrpc: '2.0', id, result }, '*');
  if (m.method === 'ui/initialize') reply(m.id, { protocolVersion: '2026-01-26', hostInfo: { name: 'test-host' }, hostCapabilities: {}, hostContext: { theme } });
  else if (m.method === 'ui/notifications/initialized') f.contentWindow.postMessage({ jsonrpc: '2.0', method: 'ui/notifications/tool-result', params: { content: [{ type: 'text', text: JSON.stringify(window.SAMPLE) }], structuredContent: window.SAMPLE } }, '*');
  else if (m.method === 'ui/notifications/size-changed') f.style.height = Math.min(1200, m.params.height + 2) + 'px';
  else if (m.method === 'tools/call') {
    window.calls.push(m.params);
    const replies = { register_account: { registration_id: 'r1', registration_session: 's1', status: 'pending_email' },
                      connect_site: { vendor: 'sungrow', method: 'fields', connected: ['sungrow:S4'], contested: [] },
                      list_sites: { sites: [{ id: 'sungrow:S4', name: 'Bound A234', demo: false }] },
                      get_status: { id: 'sungrow:1445844', soc_pct: 72, pv_w: 4213, load_w: 1180, grid_w: 1533, battery_w: 1500 },
                      update_ai_plus: { ok: true, variant: 'smart', applied: { hard_floor: 15 }, settings: { hard_floor: 15 } },
                      create_alert: { id: 3, name: 'New' }, delete_alert: { deleted: 1 },
                      list_alerts: { rules: [{ id: 3, name: 'New', metric: 'soc', operator: 'below', threshold: 20, email: true, cooldown_minutes: 360 }] },
                      verify_registration: { username: 'bob@example.com', key_saved: '~/.aivy/credentials.json' },
                      sign_in: { id: 3, scope: 'control' } };
    reply(m.id, { content: [{ type: 'text', text: JSON.stringify(replies[m.params.name] || { ok: true, energy_mode: 'forced', reverts_at: new Date(Date.now() + 3600e3).toISOString() }) }] });
  }
  else if (m.method === 'ui/open-link') reply(m.id, {});
});
fetch((q.get('card') === 'target' ? 'plan' : q.get('card')) + '.html').then(r => r.text()).then(html => {
  window.SAMPLE = SAMPLES[q.get('card')];
  f.srcdoc = html;
});
const SAMPLES = {
  control: { id: 'sungrow:1445844', energy_mode: 'amber_smart', time_slots: [{ type: 'discharge', start: '17:30', end: '20:00', power: 5000, stop_soc: 20 }, { type: 'charge', start: '01:00', end: '04:00', power: 5000, target_soc: 100 }], soc_floor_pct: 10, variant: 'smart', reverts_at: null, reverts_to: null },
  connect: { vendors: [{ id: 'sungrow', name: 'Sungrow', available: true, control: 'full', connect: { method: 'fields', fields: ['sn', 'nmi'] } }, { id: 'sigenergy', name: 'Sigenergy', available: true, control: 'full', connect: { method: 'fields', fields: ['system_id'] } }, { id: 'alphaess', name: 'AlphaESS', available: true, control: 'partial', control_limit: 'zero-export only', connect: { method: 'oauth' } }, { id: 'solax', name: 'SolaX', available: true, control: 'full', connect: { method: 'oauth' } }, { id: 'deye', name: 'Deye', available: false, control: 'full', connect: { method: 'fields', fields: ['sn'] } }, { id: 'goodwe', name: 'GoodWe', available: false, control: 'full', connect: { method: 'fields', fields: ['sn'] } }] },
  curve: (() => { const n = 288, t = [], s = { pv: [], load: [], battery: [], grid: [], soc: [] }; let soc = 40; for (let i = 0; i < n; i++) { const h = i / 12; const pv = Math.max(0, Math.sin((h - 6) / 12 * Math.PI)) * 5200 * (h > 6 && h < 19 ? 1 : 0); const load = 600 + (h > 17 && h < 22 ? 1800 : 0) + Math.random() * 200; const batt = h > 8 && h < 15 ? Math.min(3000, pv - load) : h > 17 && h < 22 ? -2500 : 0; soc = Math.max(10, Math.min(100, soc + batt / 12 / 10000 * 100)); const grid = pv - load - batt; t.push(`2026-11-06T${String(Math.floor(h)).padStart(2, '0')}:${String((i % 12) * 5).padStart(2, '0')}:00+10:30`); s.pv.push(Math.round(pv)); s.load.push(Math.round(load)); s.battery.push(Math.round(batt)); s.grid.push(Math.round(grid)); s.soc.push(Math.round(soc)); } return { id: 'sungrow:1445844', name: 'Home', range: '1d', date_from: '2026-11-06', date_to: '2026-11-06', timezone: 'Australia/Adelaide', granularity_seconds: 300, local_times: t, series: s }; })(),
  earnings: { site_id: 'sungrow:1445844', date: '2026-11-05', timezone: 'Australia/Adelaide', totals: { export_kwh: 14.2, import_kwh: 3.1, export_earned_dollars: 4.86, import_cost_dollars: 0.62, net_dollars: 4.24, avg_sell_c: 34.2 }, hourly: Array.from({ length: 24 }, (_, h) => ({ hour: `${String(h).padStart(2, '0')}:00`, export_earned_dollars: h >= 9 && h <= 15 ? 0.3 + Math.random() * .4 : h >= 17 && h <= 20 ? 0.6 + Math.random() * .5 : 0, import_cost_dollars: h < 6 ? 0.08 : h > 21 ? 0.1 : 0 })), coverage: { energy_coverage: 0.97 }, quality: 'estimated' },
  operations: { id: 'sungrow:1445844', logs: [{ at: new Date(Date.now() - 12 * 60000).toISOString(), action: 'discharge', source: 'auto', reason: 'feed-in 48.2c above export threshold 30c; SOC 86%', success: true }, { at: new Date(Date.now() - 95 * 60000).toISOString(), action: 'stop', source: 'auto', reason: 'SOC 21% at floor 20%', success: true }, { at: new Date(Date.now() - 6 * 3600e3).toISOString(), action: 'set_mode', source: 'api', reason: 'forced via API key 14 (Claude Code) aivy-mcp/0.8.0', success: true }, { at: new Date(Date.now() - 26 * 3600e3).toISOString(), action: 'charge', source: 'auto', reason: 'import 8.1c below charge threshold 10c', success: false }] },
  aiplus: { id: 'sungrow:1445844', active: true, variant: 'smart', variant_options: ['smart', 'band', 'score'], settings: { hard_floor: 10, a_export_floor: 30, z_charge_target: 80, charge_import_threshold_c: 0, export_threshold_c: 30, spike_peak_ratio: 0.7, grid_charge_allowed: true }, tunable: { hard_floor: { type: 'int', default: 8, min: 0, max: 50, unit: '%', step: 1 }, a_export_floor: { type: 'int', default: 30, min: 10, max: 90, unit: '%', step: 5 }, z_charge_target: { type: 'int', default: 80, min: 50, max: 100, unit: '%', step: 5 }, charge_import_threshold_c: { type: 'float', default: 0, min: -50, max: 50, unit: 'c/kWh', step: 1 }, export_threshold_c: { type: 'float', default: 30, min: 0, max: 200, unit: 'c/kWh', step: 1 }, spike_peak_ratio: { type: 'float', default: 0.7, min: 0.1, max: 1, unit: '', step: 0.05 }, grid_charge_allowed: { type: 'bool', default: true } }, soc_floor_pct: 10 },
  alerts: { site_id: 'sungrow:1445844', rules: [{ id: 1, name: 'Battery low', metric: 'soc', operator: 'below', threshold: 20, email: true, cooldown_minutes: 360, last_triggered_at: '2026-11-04T20:10:00+00:00' }, { id: 2, name: 'Price spike', metric: 'export_price', operator: 'above', threshold: 100, email: false, cooldown_minutes: 60, last_triggered_at: null }] },
  sites: { sites: [{ id: 'sungrow:1445844', vendor: 'sungrow', name: 'Home', online: true, current_power_w: 3013, demo: false }, { id: 'sigenergy:9c1f', vendor: 'sigenergy', name: 'Beach house', online: false, current_power_w: null, demo: false }, { id: 'sandbox:SBX-001', vendor: 'sandbox', name: 'Sandbox Home A (demo)', online: true, current_power_w: 900, demo: true }], warnings: [] },
  target: { site_id: 'sungrow:1445844', soc_now: 86, target_soc: 30, capacity_kwh: 12.8, hours: 3.5, power_w: 2100, energy_kwh: 6.8, start: '17:30', end: '21:00', timezone: 'Australia/Adelaide', current_mode: 'amber_smart', slot: { type: 'discharge', start: '17:30', end: '21:00', stop_soc: 30, pace: true, power: 5000 }, proposed_time_slots: [{ type: 'discharge', start: '17:30', end: '21:00', stop_soc: 30, pace: true, power: 5000 }], conflicts: [], notes: ['Forced-mode windows repeat every day until the schedule is changed.'] },
  signup: { registration_available: true, version: 'aivy-registration-2026-10-20', web: 'https://bridge.ivyenergy.com.au/terms' },
  status: { id: 'sungrow:1445844', name: 'Home', at: new Date().toISOString(), soc_pct: 72.5, pv_w: 4213, load_w: 1180, grid_w: 1533, battery_w: 1500, source: 'vendor' },
  plan: { site_id: 'sungrow:1445844', soc_now: 86.0, reserve_soc: 20, capacity_kwh: 12.8, current_mode: 'amber_smart', timezone: 'Australia/Adelaide', window_start: '16:30', window_end: '22:00',
          intervals: [{ date: '2026-11-06', start: '17:30', end: '18:00', sell_c: 48.2, kwh: 2.5, power_w: 5000 }, { date: '2026-11-06', start: '18:00', end: '18:30', sell_c: 66.9, kwh: 2.5, power_w: 5000 }, { date: '2026-11-06', start: '18:30', end: '19:00', sell_c: 41.0, kwh: 1.8, power_w: 3600 }],
          slots: [], proposed_time_slots: [{ type: 'discharge', start: '17:30', end: '19:00', power: 5000, stop_soc: 20 }], conflicts: [], energy_kwh: 6.8, unplaced_kwh: 0, revenue_dollars: 3.61, avg_sell_c: 53.1, window_avg_sell_c: 29.4, power_w: 5000,
          notes: ['Forced-mode windows repeat every day until the schedule is changed.', 'Applying switches this station from Ai+ to forced mode; Ai+ trading pauses until switched back.'] },
  prices: { timezone: 'Australia/Adelaide', currency: 'c/kWh', resolution_minutes: 30, summary: { spike_ahead: false, buy_min_c: 8.1, buy_max_c: 52.3, sell_min_c: 2.0, sell_max_c: 66.9, peak_sell_window: { start: '17:30', end: '19:00' }, cheap_buy_window: { start: '12:00', end: '14:00' } },
            rows: Array.from({ length: 16 }, (_, i) => { const h = 12 + Math.floor(i / 2), m = i % 2 ? '30' : '00'; const peak = i >= 11 && i <= 13; return { date: '2026-11-06', start: `${h}:${m}`, end: `${h + (m === '30' ? 1 : 0)}:${m === '30' ? '00' : '30'}`, buy_c: peak ? 52.3 - (i - 11) * 6 : 8.1 + i * 1.7, sell_c: peak ? 66.9 - (i - 11) * 12 : 2.0 + i * 1.1, kind: i === 0 ? 'current' : 'forecast', spike: false }; }) },
};
</script>

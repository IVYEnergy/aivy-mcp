<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aivy power history</title>
<style>/*BASE_CSS*/
.chart svg { width: 100%; height: 190px; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--text2); margin-top: 8px; }
.legend i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; margin-right: 5px; vertical-align: 3px; }
.legend b { color: var(--text); font-weight: 600; margin-left: 4px; }
</style>
</head>
<body>
<div class="card">
  <div class="card-head">
    <div class="mark"><svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 4 5-8 4 5"/></svg></div>
    <div><div class="title" id="title">Power history</div><div class="sub" id="sub"></div></div>
    <div class="spacer"></div><span class="chip" id="range"></span>
  </div>
  <div class="card-body">
    <div class="empty" id="empty">Loading history…</div>
    <div class="chart" id="chart" hidden><svg id="svg" viewBox="0 0 560 190" preserveAspectRatio="none"></svg><div class="legend" id="legend"></div></div>
  </div>
  <div class="card-foot"><span>W, left axis · SOC %, right axis</span><span class="spacer"></span><span id="gran"></span></div>
</div>
<script>/*BRIDGE_JS*/</script>
<script>
(function () {
  var B = window.AivyBridge, $ = function (id) { return document.getElementById(id); };
  var NS = 'http://www.w3.org/2000/svg';
  function el(tag, attrs, text) { var e = document.createElementNS(NS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); if (text !== undefined) e.textContent = text; return e; }
  var CH = [['pv', 'Solar', 'var(--gold)'], ['load', 'Home', 'var(--text2)'], ['battery', 'Battery', 'var(--brand)'], ['grid', 'Grid', 'var(--info)']];
  B.onData(function (d) {
    if (d.error) { $('empty').innerHTML = '<span class="err">' + B.esc(d.error) + '</span>'; return; }
    var times = d.local_times || d.times || [], series = d.series || {}, n = times.length;
    if (!n) { $('empty').textContent = 'No history for this day.'; return; }
    $('empty').hidden = true; $('chart').hidden = false;
    $('title').textContent = B.siteLabel(d) + ' · power history';
    $('sub').textContent = (d.date_from === d.date_to ? d.date_from : d.date_from + ' to ' + d.date_to) + (d.timezone ? ' · ' + d.timezone : '');
    $('range').textContent = d.range || ''; $('gran').textContent = d.granularity_seconds ? (d.granularity_seconds >= 86400 ? 'daily' : (d.granularity_seconds / 60) + '-minute') : '';
    var stride = Math.max(1, Math.ceil(n / 400));
    var idx = []; for (var i = 0; i < n; i += stride) idx.push(i);
    var svg = $('svg'); while (svg.firstChild) svg.removeChild(svg.firstChild);
    var W = 560, H = 190, L = 40, R = 34, T = 8, Bm = 22;
    var vals = []; CH.forEach(function (c) { (series[c[0]] || []).forEach(function (v) { if (v !== null && v !== undefined) vals.push(v); }); });
    if (!vals.length) { $('empty').hidden = false; $('empty').textContent = 'No power channels reported.'; $('chart').hidden = true; return; }
    var max = Math.max.apply(null, vals), min = Math.min(0, Math.min.apply(null, vals)); if (max === min) max = min + 1;
    var x = function (i) { return L + (W - L - R) * i / Math.max(1, n - 1); };
    var y = function (v) { return T + (H - T - Bm) * (1 - (v - min) / (max - min)); };
    var ys = function (v) { return T + (H - T - Bm) * (1 - v / 100); };
    [min, 0, max].forEach(function (v, k) { if (k === 1 && min === 0) return; svg.appendChild(el('line', { x1: L, x2: W - R, y1: y(v), y2: y(v), stroke: 'var(--border)' })); svg.appendChild(el('text', { x: L - 4, y: y(v) + 4, 'text-anchor': 'end', 'font-size': 10, fill: 'var(--text3)' }, Math.round(v / 1000 * 10) / 10 + 'k')); });
    [0, 50, 100].forEach(function (v) { svg.appendChild(el('text', { x: W - R + 4, y: ys(v) + 4, 'font-size': 10, fill: 'var(--brand)' }, v + '%')); });
    var soc = series.soc || [];
    if (soc.some(function (v) { return v !== null && v !== undefined; })) {
      var dpath = '', first = true;
      idx.forEach(function (i) { var v = soc[i]; if (v === null || v === undefined) return; dpath += (first ? 'M' : 'L') + x(i).toFixed(1) + ' ' + ys(v).toFixed(1) + ' '; first = false; });
      if (dpath) { var last = idx[idx.length - 1]; svg.appendChild(el('path', { d: dpath + 'L' + x(last).toFixed(1) + ' ' + ys(0) + ' L' + x(idx[0]).toFixed(1) + ' ' + ys(0) + ' Z', fill: 'var(--brand)', opacity: .08 })); svg.appendChild(el('path', { d: dpath, fill: 'none', stroke: 'var(--brand)', 'stroke-width': 1.5, 'stroke-dasharray': '4 3' })); }
    }
    var legend = '';
    CH.forEach(function (c) {
      var s = series[c[0]]; if (!s || !s.some(function (v) { return v !== null && v !== undefined; })) return;
      var dpath = '', first = true, lastv = null;
      idx.forEach(function (i) { var v = s[i]; if (v === null || v === undefined) { first = true; return; } dpath += (first ? 'M' : 'L') + x(i).toFixed(1) + ' ' + y(v).toFixed(1) + ' '; first = false; lastv = v; });
      svg.appendChild(el('path', { d: dpath, fill: 'none', stroke: c[2], 'stroke-width': 1.8, 'stroke-linejoin': 'round' }));
      legend += '<span><i style="background:' + c[2] + '"></i>' + c[1] + '<b>' + B.kw(lastv) + '</b></span>';
    });
    var lastSoc = null; for (var j = soc.length - 1; j >= 0; j--) { if (soc[j] !== null && soc[j] !== undefined) { lastSoc = soc[j]; break; } }
    if (lastSoc !== null) legend += '<span><i style="background:var(--brand);opacity:.5"></i>SOC<b>' + Math.round(lastSoc) + '%</b></span>';
    $('legend').innerHTML = legend;
    [0, Math.floor(n / 2), n - 1].forEach(function (i) { var t = String(times[i] || ''); var lbl = d.granularity_seconds >= 86400 ? t.slice(5, 10) : t.slice(11, 16); svg.appendChild(el('text', { x: x(i), y: H - 6, 'text-anchor': i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle', 'font-size': 10, fill: 'var(--text3)' }, lbl)); });
    B.resize();
  });
})();
</script>
</body>
</html>

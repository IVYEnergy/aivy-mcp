<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aivy site status</title>
<style>/*BASE_CSS*/
.flow { display: grid; grid-template-columns: 148px 1fr; gap: 14px; align-items: center; }
.ring { position: relative; width: 148px; height: 148px; }
.ring svg { width: 148px; height: 148px; transform: rotate(-90deg); }
.ring .track { stroke: var(--fill); }
.ring .arc { stroke: var(--brand); stroke-linecap: round; transition: stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1); }
.ring .label { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.ring .pct { font-size: 34px; font-weight: 700; letter-spacing: -1px; line-height: 1; }
.ring .cap { font-size: 11px; color: var(--text3); margin-top: 4px; text-transform: uppercase; letter-spacing: .4px; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile { background: var(--fill); border-radius: 12px; padding: 10px 12px; min-height: 64px; }
.tile .k { display: flex; align-items: center; gap: 6px; color: var(--text3); font-size: 11px; text-transform: uppercase; letter-spacing: .4px; }
.tile .k svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tile .v { font-size: 18px; font-weight: 600; margin-top: 4px; letter-spacing: -.3px; }
.tile .d { font-size: 11px; color: var(--text2); margin-top: 1px; }
.tile.sun .k { color: var(--gold); } .tile.grid .k { color: var(--info); } .tile.batt .k { color: var(--brand); }
@media (max-width: 420px) { .flow { grid-template-columns: 1fr; justify-items: center; } .tiles { width: 100%; } }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="card-head">
    <div class="mark"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/></svg></div>
    <div><div class="title" id="title">Site</div><div class="sub" id="sub"></div></div>
    <div class="spacer"></div>
    <span class="chip" id="source"></span>
  </div>
  <div class="card-body">
    <div class="empty" id="empty">Loading the latest reading…</div>
    <div class="flow" id="flow" hidden>
      <div class="ring">
        <svg viewBox="0 0 148 148"><circle class="track" cx="74" cy="74" r="64" fill="none" stroke-width="12"/><circle class="arc" id="arc" cx="74" cy="74" r="64" fill="none" stroke-width="12" stroke-dasharray="402" stroke-dashoffset="402"/></svg>
        <div class="label"><div><div class="pct" id="pct">--</div><div class="cap">Battery</div></div></div>
      </div>
      <div class="tiles">
        <div class="tile sun"><div class="k"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Solar</div><div class="v" id="pv">--</div><div class="d" id="pvd"></div></div>
        <div class="tile home"><div class="k"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/></svg>Home</div><div class="v" id="load">--</div><div class="d" id="loadd"></div></div>
        <div class="tile grid"><div class="k"><svg viewBox="0 0 24 24"><path d="M4 20V8l8-5 8 5v12"/><path d="M4 12h16M12 3v17"/></svg>Grid</div><div class="v" id="grid">--</div><div class="d" id="gridd"></div></div>
        <div class="tile batt"><div class="k"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="16" height="10" rx="2"/><path d="M21 10v4"/><path d="M7 11v2M11 11v2"/></svg>Battery</div><div class="v" id="batt">--</div><div class="d" id="battd"></div></div>
      </div>
    </div>
  </div>
  <div class="card-foot"><span id="when"></span><span class="spacer"></span><span>Aivy</span></div>
</div>
<script>/*BRIDGE_JS*/</script>
<script>
(function () {
  var B = window.AivyBridge, $ = function (id) { return document.getElementById(id); };
  B.onData(function (d) {
    if (d.error) { $('empty').innerHTML = '<span class="err">' + B.esc(d.error) + '</span>'; $('flow').hidden = true; return; }
    $('title').textContent = B.siteLabel(d);
    $('sub').textContent = B.vendor(d) ? B.vendor(d).charAt(0).toUpperCase() + B.vendor(d).slice(1) : '';
    $('source').textContent = d.source === 'stored' ? 'last reading' : 'live';
    $('source').className = 'chip ' + (d.source === 'stored' ? 'warn' : 'brand');
    $('empty').hidden = true; $('flow').hidden = false;
    var soc = d.soc_pct;
    if (soc !== null && soc !== undefined) {
      var v = Math.max(0, Math.min(100, soc));
      $('pct').textContent = Math.round(v) + '%';
      var arc = $('arc'); arc.style.stroke = v < 20 ? 'var(--danger)' : v < 50 ? 'var(--warning)' : 'var(--brand)';
      requestAnimationFrame(function () { arc.style.strokeDashoffset = String(402 - 402 * v / 100); });
    } else { $('pct').textContent = '--'; }
    $('pv').textContent = B.kw(d.pv_w); $('pvd').textContent = d.pv_w > 50 ? 'generating' : d.pv_w === null || d.pv_w === undefined ? 'not reported' : 'idle';
    $('load').textContent = B.kw(d.load_w); $('loadd').textContent = d.load_w === null || d.load_w === undefined ? 'not reported' : 'consumption';
    var g = d.grid_w; $('grid').textContent = B.kw(g);
    $('gridd').textContent = g === null || g === undefined ? 'not reported' : g > 20 ? 'exporting' : g < -20 ? 'importing' : 'balanced';
    var b = d.battery_w; $('batt').textContent = B.kw(b);
    $('battd').textContent = b === null || b === undefined ? 'not reported' : b > 20 ? 'charging' : b < -20 ? 'discharging' : 'idle';
    $('battd').style.color = b > 20 ? 'var(--charge)' : b < -20 ? 'var(--discharge)' : '';
    var at = d.at ? new Date(d.at) : null;
    $('when').textContent = at && !isNaN(at) ? at.toLocaleString(undefined, { hour: '2-digit', minute: '2-digit', day: 'numeric', month: 'short' }) : '';
    B.resize();
  });
})();
</script>
</body>
</html>
